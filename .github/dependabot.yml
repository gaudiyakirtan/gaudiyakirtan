# Dependabot config, tuned for LOW NOISE. The value we actually want is CVE protection, which comes
# from **Dependabot security updates** (repo Settings → Code security) + alerts — those only open a
# PR when there's a real vulnerability, so they're rare and high-signal. The routine version bumps
# below are the part that spams, so they are: (a) monthly, and (b) GROUPED — every ecosystem's
# updates collapse into a single PR per run instead of one PR per dependency (the first run opened
# 20 separate PRs, which is what flooded the inbox). Net: at most ~4 PRs/month, not dozens.
version: 2
updates:
  # Web (Next.js / React) — the actively deployed surface.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      web-dependencies:
        patterns: ["*"] # one PR for the whole ecosystem, all update types (incl. major)

  - package-ecosystem: gradle
    directory: /andorid
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      android-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      pipeline-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
