name: All Platform Build Verification

on:
  push:
    branches: [ mono ]
  pull_request:
    branches: [ mono ]
  workflow_dispatch:

jobs:
  check-changes:
    name: Check Changed Files
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      web: ${{ steps.filter.outputs.web }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Check file changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/ios-build.yml'
            android:
              - 'andorid/**'
              - '.github/workflows/android-build.yml'
            web:
              - 'web/**'
              - '.github/workflows/web-build.yml'
  
  ios-build:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.ios == 'true' }}
    uses: ./.github/workflows/ios-build.yml
  
  android-build:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.android == 'true' }}
    uses: ./.github/workflows/android-build.yml
  
  web-build:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.web == 'true' }}
    uses: ./.github/workflows/web-build.yml
    
  # If no platform-specific changes detected, run all builds on workflow_dispatch
  all-platforms-manual:
    needs: check-changes
    if: |
      github.event_name == 'workflow_dispatch' && 
      needs.check-changes.outputs.ios != 'true' && 
      needs.check-changes.outputs.android != 'true' && 
      needs.check-changes.outputs.web != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Trigger iOS build
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ios-build.yml
          ref: ${{ github.ref }}
      
      - name: Trigger Android build
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: android-build.yml
          ref: ${{ github.ref }}
      
      - name: Trigger Web build
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: web-build.yml
          ref: ${{ github.ref }}