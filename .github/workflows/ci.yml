name: CI

# One workflow for the whole monorepo. Replaces the 5 overlapping workflows (CI + All/Web/Android/iOS
# Build Verification) that all fired on every event — ~5× the runs, and ~5× the failure emails.
on:
  push:
    branches: [mono, main]
  pull_request:
    branches: [mono, main]

# Don't run duplicate CI for a branch that also has an open PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which platform actually changed, so a web/docs commit doesn't trigger (and fail) the
  # iOS/Android builds — that per-push failure across every commit was the main source of email spam.
  # Also gates out Dependabot's automated PRs entirely: they land as one grouped monthly PR that you
  # review by hand, and running full native builds on each was pure noise.
  changes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
            android:
              - 'andorid/**'
            ios:
              - 'ios/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test --if-present

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andorid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug
      - run: ./gradlew :app:testDebugUnitTest

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # The project is Xcode file format 77. macOS 14 defaults to Xcode 15.4, which rejects the
    # project before compilation; the macOS 15 image includes Xcode 26.3 and iOS 26 simulators.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild build \
            -project gk-ios.xcodeproj -scheme gk-ios \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
