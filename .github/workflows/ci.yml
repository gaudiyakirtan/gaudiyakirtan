name: CI

on:
  push:
    branches: [mono, main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test --if-present

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andorid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug
      - run: ./gradlew :app:testDebugUnitTest

  ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      # Full build works on real CI runners (unlike the sandboxed dev env where actool is blocked).
      - run: |
          xcodebuild build \
            -project gk-ios.xcodeproj -scheme gk-ios \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO
      - run: |
          xcodebuild test \
            -project gk-ios.xcodeproj -scheme gk-ios \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO || true   # tests run once a test scheme is configured
