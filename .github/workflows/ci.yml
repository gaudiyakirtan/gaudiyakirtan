name: CI

# One workflow for the whole monorepo. Replaces the 5 overlapping workflows (CI + All/Web/Android/iOS
# Build Verification) that all fired on every event — ~5× the runs, and ~5× the failure emails.
on:
  push:
    branches: [mono, main]
  pull_request:
    branches: [mono, main]

# Don't run duplicate CI for a branch that also has an open PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which platform actually changed, so a web/docs commit doesn't trigger (and fail) the
  # iOS/Android builds — that per-push failure across every commit was the main source of email spam.
  # Also gates out Dependabot's automated PRs entirely: they land as one grouped monthly PR that you
  # review by hand, and running full native builds on each was pure noise.
  changes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            android:
              - 'andorid/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test --if-present

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andorid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug
      - run: ./gradlew :app:testDebugUnitTest

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # macos-14 ships Xcode 15.4, which cannot open this project at all: gk-ios.xcodeproj is
    # `objectVersion = 77`, which needs Xcode 16+. The job failed in ~12 seconds on every run,
    # before compiling a single file — so despite looking like coverage, no iOS code in this repo
    # had ever actually been built in CI, and no iOS test had ever run.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Recorded in the log so a future toolchain bump on the runner image is visible in the run
      # itself rather than showing up as a mystery compile error.
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build
        run: |
          xcodebuild build \
            -project gk-ios.xcodeproj -scheme gk-ios \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

      # The point of this job. `build` alone never executed a single assertion, so the unit tests
      # (SongRepository/decoding/search/settings/calendar) were dead weight in CI.
      - name: Test
        run: |
          xcodebuild test \
            -project gk-ios.xcodeproj -scheme gk-ios \
            -destination "$DESTINATION" \
            -resultBundlePath ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/ios-tests.xcresult
    env:
      # Pinned to a device the macos-15 image ships. Kept in one place so build and test can never
      # drift onto different simulators.
      DESTINATION: platform=iOS Simulator,name=iPhone 16
