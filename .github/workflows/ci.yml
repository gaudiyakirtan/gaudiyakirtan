name: CI

# One workflow for the whole monorepo. Replaces the 5 overlapping workflows (CI + All/Web/Android/iOS
# Build Verification) that all fired on every event — ~5× the runs, and ~5× the failure emails.
on:
  push:
    branches: [mono, main]
  pull_request:
    branches: [mono, main]

# Don't run duplicate CI for a branch that also has an open PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which platform actually changed, so a web/docs commit doesn't trigger (and fail) the
  # iOS/Android builds — that per-push failure across every commit was the main source of email spam.
  # Also gates out Dependabot's automated PRs entirely: they land as one grouped monthly PR that you
  # review by hand, and running full native builds on each was pure noise.
  changes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
            android:
              - 'andorid/**'
            ios:
              - 'ios/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test --if-present

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andorid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug
      - run: ./gradlew :app:testDebugUnitTest

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild build \
            -project gk-ios.xcodeproj -scheme gk-ios \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - run: |
          xcodebuild test \
            -project gk-ios.xcodeproj -scheme gk-ios \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -resultBundlePath "$RUNNER_TEMP/gk-ios-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Capture Home screenshots
        if: always()
        run: |
          xcrun simctl ui booted appearance light
          xcrun simctl launch --terminate-running-process booted gaudiyakirtan.gk-ios
          sleep 3
          xcrun simctl io booted screenshot "$RUNNER_TEMP/home-ios-gaura.png"
          xcrun simctl ui booted appearance dark
          sleep 1
          xcrun simctl io booted screenshot "$RUNNER_TEMP/home-ios-shyam.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-home-v7
          path: |
            ${{ runner.temp }}/gk-ios-tests.xcresult
            ${{ runner.temp }}/home-ios-gaura.png
            ${{ runner.temp }}/home-ios-shyam.png
